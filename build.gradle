buildscript {
    repositories {
        jcenter()
        maven { url = "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0.13'
group = 'com.divineenchantments'
archivesBaseName = 'DivineEnchantments-1.12.2'

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs += ['-proc:none']
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
    makeObfSourceJar = false
}

runServer {
    args 'nogui', '--nogui'
}

getAssets.enabled = false

repositories {
    maven { url "https://dvs1.progwml6.com/files/maven" }
    maven { url "https://modmaven.dev/" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://www.cursemaven.com" }
    flatDir {
        dirs "/run/media/Aelfwif/F6F25B3AF25AFE75/Users/mesno/AppData/Roaming/PrismLauncher/instances/cleanroom-0.6.13-alpha/minecraft/mods",
             "/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.3/instances/cleanroom-0.7.7-alpha/minecraft/mods",
             "/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.3/instances/RLCraft Dregora/minecraft/mods",
             "/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.5/instances/cleanroom-0.7.7-alpha/minecraft/mods",
             "/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.5/instances/RLCraft Dregora/minecraft/mods"
    }
}

dependencies {
    compileOnly "mezz.jei:jei_1.12.2:4.15.0.291:api"
    compileOnly fileTree(dir: '/run/media/Aelfwif/F6F25B3AF25AFE75/Users/mesno/AppData/Roaming/PrismLauncher/instances/cleanroom-0.6.13-alpha/minecraft/mods', include: ['*.jar'])
    compileOnly fileTree(dir: '/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.3/instances/cleanroom-0.7.7-alpha/minecraft/mods', include: ['*.jar'])
    compileOnly fileTree(dir: '/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.3/instances/RLCraft Dregora/minecraft/mods', include: ['*.jar'])
    compileOnly fileTree(dir: '/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.5/instances/cleanroom-0.7.7-alpha/minecraft/mods', include: ['*.jar'])
    compileOnly fileTree(dir: '/home/Aelfwif/Downloads/PrismLauncher-Linux-Qt6-Portable-11.0.5/instances/RLCraft Dregora/minecraft/mods', include: ['*.jar'])
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "DivineEnchantments",
            "Specification-Vendor": "DivineEnchantments",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "DivineEnchantments",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
